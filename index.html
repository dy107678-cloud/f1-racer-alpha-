<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Formula Racer — Arcade Grand Prix</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    height: 100dvh; /* actual visible viewport on mobile — avoids the classic 100% / 100vh mobile bug
                       where address-bar show/hide makes the page lay out taller than what's on screen */
    background: #0a0b12;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    height: 100%; width: 100%;
    height: 100dvh;
    padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    gap: 6px;
  }
  /* #stage fills all leftover vertical space after #hint's own height — CSS/flexbox decides
     the exact box, not JS math. min-height:0 is required so flex allows it to shrink correctly. */
  #stage {
    position: relative; width: 100%; max-width: 1180px;
    flex: 1 1 auto; min-height: 0; min-width: 0;
  }
  canvas {
    display: block; width: 100%; height: 100%; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    cursor: pointer;
    background: #0d0f1a;
    touch-action: none;
  }
  #hint {
    flex: 0 0 auto;
    text-align: center; color: #6a6f89; font-size: 12px;
    letter-spacing: 0.3px;
  }
  #hint b { color: #b9bcd0; }

  /* -------- on-screen mobile controls -------- */
  #mobileControls {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .15s ease;
  }
  body.is-touch #mobileControls { display: block; }
  body:not(.is-touch) #mobileControls { display: none; }
  body[data-state="RACING"] #mobileControls,
  body[data-state="COUNTDOWN"] #mobileControls,
  body[data-state="PAUSED"] #mobileControls {
    opacity: 1; pointer-events: none;
  }
  .mc-btn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(20, 22, 34, 0.55);
    border: 2px solid rgba(255,255,255,0.28);
    color: #fff; font-size: 22px; font-weight: 700;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    touch-action: none;
  }
  .mc-btn:active, .mc-btn.mc-active {
    background: rgba(225, 6, 0, 0.55); border-color: #ff8080;
  }
  .mc-steer { width: 15%; aspect-ratio: 1/1; max-width: 68px; bottom: max(4%, env(safe-area-inset-bottom)); }
  #btnLeft { left: 3%; }
  #btnRight { left: calc(3% + 16%); }
  .mc-accel { width: 20%; aspect-ratio: 1/1; max-width: 88px; right: 3%; bottom: max(4%, env(safe-area-inset-bottom)); font-size: 28px; }
  .mc-brake { width: 15%; aspect-ratio: 1/1; max-width: 68px; right: calc(3% + 21%); bottom: max(5.5%, env(safe-area-inset-bottom)); }
  .mc-boost { width: 13%; aspect-ratio: 1/1; max-width: 58px; right: calc(3% + 3%); bottom: calc(4% + 24%); font-size: 18px; background: rgba(255,160,20,0.35); border-color: #ffb020; }
  .mc-boost:active, .mc-boost.mc-active { background: rgba(255,160,20,0.7); }
  .mc-pause {
    position: absolute; pointer-events: auto; top: max(3%, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(20,22,34,0.6); border: 2px solid rgba(255,255,255,0.28);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px;
    touch-action: none;
  }
  body.is-touch #hint { display: none; }
  #rotateHint {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(8,9,14,0.94); color: #fff;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    text-align: center; padding: 24px; font-size: 15px;
  }
  @media (max-width: 560px) and (orientation: portrait) {
    body.is-touch #rotateHint { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="mobileControls">
      <div class="mc-btn mc-pause" id="btnPause">⏸</div>
      <div class="mc-btn mc-steer" id="btnLeft">◀</div>
      <div class="mc-btn mc-steer" id="btnRight">▶</div>
      <div class="mc-btn mc-boost" id="btnBoost">⚡</div>
      <div class="mc-btn mc-brake" id="btnBrake">▼</div>
      <div class="mc-btn mc-accel" id="btnAccel">▲</div>
    </div>
    <div id="hint"><b>W/↑</b> Accelerate &nbsp; <b>S/↓</b> Brake &nbsp; <b>A/D</b> or <b>←/→</b> Steer &nbsp; <b>Space</b> Boost &nbsp; <b>P</b> Pause — click menu buttons with mouse or tap</div>
  </div>
</div>
<div id="rotateHint">
  <div style="font-size:34px;">📱↻</div>
  <div>Rotate your device to landscape<br>for the best racing experience.</div>
</div>

/* ------------------------------- UTILS ---------------------------------- */
const TAU = Math.PI * 2;
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function norm01(v, lo, hi) { return clamp((v - lo) / (hi - lo), 0, 1); }
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
function choice(arr) { return arr[(Math.random() * arr.length) | 0]; }
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(2).padStart(5, '0');
  return `${m}:${s}`;
}
function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
  const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
  return { x, y };
}

/* Named AI difficulty profiles, one per track difficulty tier. skill drives cornering/mistake
   quality (existing system); pitThreshold is the tire-wear fraction (of the 0-1 "healthy to red"
   range) at which a bot decides to head for the pits — LOWER means the bot plans ahead and pits
   proactively (rarely gets caught out critical far from the pit), HIGHER means it waits later
   and risks a tire failure if it can't reach the pit in time. pitVariance adds natural spread. */
const DIFFICULTY_PROFILES = {
  Easy: { skill: 0.45, pitThreshold: 0.68, pitVariance: 0.10, reaction: 0.32 },
  Medium: { skill: 0.72, pitThreshold: 0.55, pitVariance: 0.07, reaction: 0.16 },

/* Returns true if arc-length s falls within a (possibly wraparound) zone [s0,s1] on the track. */
function inZoneS(zone, s, total) {
  s = ((s % total) + total) % total;
  if (zone.s0 <= zone.s1) return s >= zone.s0 && s <= zone.s1;
  return s >= zone.s0 || s <= zone.s1;
}

/* -------------------------------- TRACK ---------------------------------- */
class Track {
  constructor(def) {
    this.def = def;
    this.width = def.width;
    this._buildSpline(def.waypoints);
    this._buildCheckpoints(10);
    this._buildBoostPads(4);
    this._buildBombPool();
    this.activeBombs = [];
    this._buildPitZone();
    this.pitLaneOffset = this.width / 2 + 34; // lateral distance of the pit lane's centerline from the track centerline
    // Wider than the physical pit zone — this is the window where cars are allowed to be out
    // near/past the normal track edge without tripping the off-track or AI line-correction
    // checks, matching the distance the AI actually starts steering wide to line up its entry.
    this.pitApproachZone = { s0: ((this.pitZone.s0 - 380) % this.total + this.total) % this.total, s1: this.pitZone.s1 };
    this.startS = 0;
  }

  /* Places the pit zone on the straightest available stretch in the final ~30% of the lap
     (biased toward the start/finish straight, like a real pit lane) rather than a fixed
     percentage of track length. A fixed percentage can land the zone on a sharp corner on
     tracks with a hairpin late in the lap (e.g. Bahrain) — an offset "pit lane" running
     parallel to a tight curve is geometrically unreliable, which made cars physically unable
     to complete the lane change in time and get stuck looping through tire failures. */
  _buildPitZone() {
    const N = this.N, step = this.step;
    const zoneLenUnits = 190;
    const zoneLenSamples = Math.max(6, Math.round(zoneLenUnits / step));
    const curv = new Array(N);
    for (let i = 0; i < N; i++) {
      curv[i] = Math.abs(angDiff(this.points[i].angle, this.points[(i + 1) % N].angle));
    }
    const lo = Math.floor(N * 0.68);
    const hi = Math.max(lo + 1, N - zoneLenSamples - 2);
    let bestIdx = lo, bestMax = Infinity;
    for (let i = lo; i <= hi; i++) {
      let maxC = 0;
      for (let k = 0; k < zoneLenSamples; k++) maxC = Math.max(maxC, curv[i + k]);
      if (maxC < bestMax) { bestMax = maxC; bestIdx = i; }
    }
    this.pitZone = { s0: bestIdx * step, s1: (bestIdx + zoneLenSamples) * step };
  }

  _buildSpline(wp) {
    const segs = wp.length;
    const denseStepsPerSeg = 24;
    const dense = [];
    for (let i = 0; i < segs; i++) {
      const p0 = wp[(i - 1 + segs) % segs], p1 = wp[i], p2 = wp[(i + 1) % segs], p3 = wp[(i + 2) % segs];
      for (let t = 0; t < denseStepsPerSeg; t++) dense.push(catmullRom(p0, p1, p2, p3, t / denseStepsPerSeg));
    }
    const cum = [0];
    for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + dist(dense[i - 1], dense[i]));
    const total = cum[cum.length - 1] + dist(dense[dense.length - 1], dense[0]);
    const N = 420;
    const step = total / N;
    const uni = [];
    let di = 0;
    for (let k = 0; k < N; k++) {
      const targetS = k * step;
      while (di < cum.length - 1 && cum[di + 1] < targetS) di++;
      const d0 = dense[di], d1 = dense[(di + 1) % dense.length];
      const segLen = (di + 1 < cum.length) ? (cum[di + 1] - cum[di]) : (total - cum[di]);
      const localT = segLen > 0 ? clamp((targetS - cum[di]) / segLen, 0, 1) : 0;
      uni.push({ x: lerp(d0.x, d1.x, localT), y: lerp(d0.y, d1.y, localT) });
    }
    for (let k = 0; k < N; k++) {
      const p0 = uni[k], p1 = uni[(k + 1) % N];
      p0.angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
    }
    this.points = uni;
    this.N = N;
    this.step = step;
    this.total = total;
// bounds for camera / minimap
let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
for (const p of uni) {
  minX = Math.min(minX, p.x);
  minY = Math.min(minY, p.y);
  maxX = Math.max(maxX, p.x);
  maxY = Math.max(maxY, p.y);
}

this.bounds = {
  minX: minX - 400,
  minY: minY - 400,
  maxX: maxX + 400,
  maxY: maxY + 400
};

this._buildRenderChunks();
}

_buildRenderChunks() {
  const CHUNK_SIZE = 20;
  this.renderChunks = [];

  for (let start = 0; start < this.N; start += CHUNK_SIZE) {
    const end = Math.min(start + CHUNK_SIZE, this.N);

    const mainPath = new Path2D();
    const leftPath = new Path2D();
    const rightPath = new Path2D();

    let minX = Infinity, minY = Infinity;
    let maxX = -Infinity, maxY = -Infinity;

    for (let i = start; i <= end; i++) {
      const idx = i % this.N;
      const p = this.points[idx];

      const nx = -Math.sin(p.angle);
      const ny = Math.cos(p.angle);

      const lx = p.x + nx * (this.width / 2);
      const ly = p.y + ny * (this.width / 2);
      const rx = p.x - nx * (this.width / 2);
      const ry = p.y - ny * (this.width / 2);

      if (i === start) {
        mainPath.moveTo(p.x, p.y);
        leftPath.moveTo(lx, ly);
        rightPath.moveTo(rx, ry);
      } else {
        mainPath.lineTo(p.x, p.y);
        leftPath.lineTo(lx, ly);
        rightPath.lineTo(rx, ry);
      }

      minX = Math.min(minX, p.x, lx, rx);
      minY = Math.min(minY, p.y, ly, ry);
      maxX = Math.max(maxX, p.x, lx, rx);
      maxY = Math.max(maxY, p.y, ly, ry);
    }

    this.renderChunks.push({
      mainPath,
      leftPath,
      rightPath,
      minX: minX - 140,
      minY: minY - 140,
      maxX: maxX + 140,
      maxY: maxY + 140
    });
  }
}
  idxAt(s) {
    s = ((s % this.total) + this.total) % this.total;
    return Math.floor(s / this.step) % this.N;
  }
  pointAt(s) {
    return this.points[this.idxAt(s)];
  }
  normalAt(s) {
    const p = this.pointAt(s);
    return { x: -Math.sin(p.angle), y: Math.cos(p.angle) };
  }
  worldAt(s, lateral) {
    const p = this.pointAt(s), n = this.normalAt(s);
    return { x: p.x + n.x * lateral, y: p.y + n.y * lateral };
  }

  /* Project onto the nearest local track segment, not only a sampled track point. */
  nearest(x, y, guessS) {
    const guessIdx = this.idxAt(guessS == null ? 0 : guessS);
    let bestIdx = guessIdx, bestT = 0, bestD = Infinity;
    let bestX = this.points[guessIdx].x;
    let bestY = this.points[guessIdx].y;
    const win = guessS == null ? this.N : 26;

    for (let o = -win; o <= win; o++) {
      const idx = ((guessIdx + o) % this.N + this.N) % this.N;
      const p = this.points[idx];
      const q = this.points[(idx + 1) % this.N];
      const dx = q.x - p.x, dy = q.y - p.y;
      const lenSq = dx * dx + dy * dy;

      if (lenSq < 1e-9) continue;

      const t = clamp(
        ((x - p.x) * dx + (y - p.y) * dy) / lenSq,
        0,
        1
      );

      const projectedX = p.x + dx * t;
      const projectedY = p.y + dy * t;
      const ex = x - projectedX;
      const ey = y - projectedY;
      const d = ex * ex + ey * ey;

      if (d < bestD) {
        bestD = d;
        bestIdx = idx;
        bestT = t;
        bestX = projectedX;
        bestY = projectedY;
      }
    }

    const p = this.points[bestIdx];
    const q = this.points[(bestIdx + 1) % this.N];
    const dx = q.x - p.x, dy = q.y - p.y;
    const length = Math.hypot(dx, dy) || 1;
    const nx = -dy / length;
    const ny = dx / length;
    const lateral = (x - bestX) * nx + (y - bestY) * ny;
    const s = ((bestIdx + bestT) % this.N) * this.step;

    return {
      s,
      lateral,
      idx: bestIdx,
      angle: Math.atan2(dy, dx)
    };
  }

  _buildCheckpoints(count) {
    this.checkpointCount = count;
    this.checkpoints = [];
    for (let k = 0; k < count; k++) this.checkpoints.push((this.total / count) * k);
  }

  _buildBoostPads(count) {
    this.boostPads = [];
    for (let k = 0; k < count; k++) {
      const s = this.total * ((k + 0.5) / count) + rand(-this.total * 0.03, this.total * 0.03);
      this.boostPads.push({ s: ((s % this.total) + this.total) % this.total, lateral: rand(-this.width * 0.15, this.width * 0.15), radius: 42, cooldown: 0 });
    }
  }

  _buildBombPool() {
    this.bombPool = [];
    const n = 24;
    for (let k = 0; k < n; k++) {
      const frac = 0.08 + (k / n) * 0.84;
      if (frac > 0.93) continue;
      this.bombPool.push(this.total * frac);
    }
  }

  spawnBomb(avoidPositions) {
    let tries = 0;
    while (tries < 12) {
      tries++;
      const s = choice(this.bombPool) + rand(-40, 40);
      const lateral = rand(-this.width * 0.28, this.width * 0.28);
      const w = this.worldAt(s, lateral);
      let ok = true;
      for (const p of avoidPositions) if (dist(p, w) < 130) { ok = false; break; }
      for (const b of this.activeBombs) if (Math.abs(b.s - s) < this.total * 0.05) { ok = false; break; }
      if (ok) { this.activeBombs.push({ s, lateral, radius: 24, flashT: 0, respawnT: 0, alive: true }); return; }
    }
  }

  update(dt, hazardDensity, avoidPositions) {
    for (const p of this.boostPads) if (p.cooldown > 0) p.cooldown = Math.max(0, p.cooldown - dt);
    const maxBombs = Math.round(2 + hazardDensity * 3);
    this.activeBombs = this.activeBombs.filter(b => b.alive || b.respawnT > 0);
    for (const b of this.activeBombs) {
      if (!b.alive) { b.respawnT -= dt; }
      else if (b.flashT > 0) b.flashT -= dt;
    }
    this.activeBombs = this.activeBombs.filter(b => b.alive || b.respawnT > 0);
    if (this.activeBombs.filter(b => b.alive).length < maxBombs && Math.random() < 0.02 * hazardDensity) {
      this.spawnBomb(avoidPositions);
    }
  }
}

class AudioManager {
  constructor() { this.ctx = null; this.enabled = true; this.engineOsc = null; this.engineOsc2 = null; this.engineGain = null; this.engineGain2 = null; this.engineProfile = null; }
  ensure() {
    if (this.ctx) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
    } catch (e) { this.enabled = false; }
  }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); }
  beep(freq, dur, type, vol, glideTo) {
    if (!this.enabled) return;
    this.ensure();
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t0 + dur);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol == null ? 0.12 : vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  countdownTick() { this.beep(440, 0.18, 'square', 0.1); }
  countdownGo() { this.beep(880, 0.35, 'square', 0.14, 1200); }
  boost() { this.beep(220, 0.3, 'sawtooth', 0.1, 700); }
  collision() { this.beep(90, 0.18, 'square', 0.14); }
  bomb() { this.beep(60, 0.5, 'sawtooth', 0.16, 30); }
  pit() { this.beep(300, 0.2, 'triangle', 0.1, 500); }
  lap() { this.beep(660, 0.15, 'sine', 0.1, 990); }
  victory() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.3, 'triangle', 0.12), i * 140)); }
  driverVictory(driverId) {
    const theme = VICTORY_THEMES[driverId];
    if (!theme) { this.victory(); return; }
    theme.notes.forEach((f, i) => setTimeout(() => this.beep(f, theme.dur, theme.type, 0.13, i === theme.notes.length - 1 ? f * 1.5 : null), i * theme.gap * 1000));
  }
  defeat() { this.beep(220, 0.6, 'sawtooth', 0.14, 80); }
  startEngine(teamId) {
    if (!this.enabled) return;
    this.ensure();
    if (!this.ctx || this.engineOsc) return;
    const profile = ENGINE_PROFILES[teamId] || ENGINE_PROFILES.mercedes;
    try {
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain1 = this.ctx.createGain();
      const gain2 = this.ctx.createGain();
      osc1.type = profile.type1; osc2.type = profile.type2;
      osc1.frequency.value = profile.base;
      osc2.frequency.value = profile.base * profile.harmonicRatio;
      gain1.gain.value = profile.vol;
      gain2.gain.value = profile.vol * profile.harmonicGain;
      osc1.connect(gain1).connect(this.ctx.destination);
      osc2.connect(gain2).connect(this.ctx.destination);
      osc1.start(); osc2.start();
      this.engineOsc = osc1; this.engineOsc2 = osc2; this.engineGain = gain1; this.engineGain2 = gain2; this.engineProfile = profile;
    } catch (e) { /* ignore */ }
  }
  updateEngine(speedFrac) {
    if (!this.engineOsc || !this.engineProfile) return;
    const p = this.engineProfile;
    try {
      const f1 = p.base + speedFrac * p.range;
      const t = this.ctx.currentTime;
      this.engineOsc.frequency.setTargetAtTime(f1, t, 0.05);
      this.engineOsc2.frequency.setTargetAtTime(f1 * p.harmonicRatio, t, 0.05);
      this.engineGain.gain.setTargetAtTime(p.vol * (0.55 + speedFrac * 0.75), t, 0.08);
      this.engineGain2.gain.setTargetAtTime(p.vol * p.harmonicGain * (0.55 + speedFrac * 0.75), t, 0.08);
    } catch (e) { /* ignore */ }
  }
  stopEngine() {
    [this.engineOsc, this.engineOsc2].forEach((o) => { if (o) { try { o.stop(); } catch (e) {} } });
    this.engineOsc = null; this.engineOsc2 = null; this.engineGain = null; this.engineGain2 = null; this.engineProfile = null;
  }
}

/* ------------------------------- STORAGE ----------------------------------- */
const Storage = {
  hasBackend:
    typeof window !== 'undefined' &&
    window.storage &&
    typeof window.storage.get === 'function',

  hasAndroidBridge:
    typeof window !== 'undefined' &&
    window.AndroidBridge &&
    typeof window.AndroidBridge.getItem === 'function',

  hasLocalStorage:
    typeof window !== 'undefined' &&
    (() => {
      try {
        return !!window.localStorage;
      } catch (e) {
        return false;
      }
    })(),

  mem: {},

  async load(key, fallback) {
    if (this.hasAndroidBridge) {
      try {
        const raw = window.AndroidBridge.getItem(key);
        if (raw !== null && raw !== undefined && raw !== '') {
          return JSON.parse(raw);
        }
      } catch (e) {}
    }

    if (this.hasBackend) {
      try {
        const r = await window.storage.get(key, false);
        if (r && r.value !== undefined && r.value !== null) {
          return JSON.parse(r.value);
        }
      } catch (e) {}
    }

    if (this.hasLocalStorage) {
      try {
        const raw = window.localStorage.getItem(key);
        if (raw !== null) {
          return JSON.parse(raw);
        }
      } catch (e) {}
    }

    return key in this.mem ? this.mem[key] : fallback;
  },

  async save(key, value) {
    const serialized = JSON.stringify(value);

    if (this.hasAndroidBridge) {
      try {
        window.AndroidBridge.setItem(key, serialized);
        return;
      } catch (e) {}
    }

    if (this.hasBackend) {
      try {
        await window.storage.set(key, serialized, false);
        return;
      } catch (e) {}
    }

    if (this.hasLocalStorage) {
      try {
        window.localStorage.setItem(key, serialized);
        return;
      } catch (e) {}
    }

    this.mem[key] = value;
  },
};

class Input {
  constructor() {
    this.keys = new Set();
    this.justPressed = new Set();
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      const k = e.key.toLowerCase();
      if (!this.keys.has(k)) this.justPressed.add(k);
      this.keys.add(k);
    }, { passive: false });
    window.addEventListener('keyup', (e) => { this.keys.delete(e.key.toLowerCase()); });
    this.mouse = { x: 0, y: 0, clicked: false, down: false };
    // virtual on-screen control state, set by touch buttons (see boot code)
    this.touch = { throttle: 0, brake: 0, steer: 0, boost: false, pauseTap: false };
    const resetControls = () => {
  this.keys.clear();
  this.touch.throttle = 0;
  this.touch.brake = 0;
  this.touch.steer = 0;
  this.touch.boost = false;
};

window.addEventListener('blur', resetControls);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) resetControls();
});
  }
  down(k) { return this.keys.has(k); }
  pressed(k) { const v = this.justPressed.has(k); return v; }
  endFrame() { this.justPressed.clear(); this.mouse.clicked = false; }
  consumePauseTap() { const v = this.touch.pauseTap; this.touch.pauseTap = false; return v; }
  get throttle() { return (this.down('w') || this.down('arrowup') || this.touch.throttle) ? 1 : 0; }
  get brake() { return (this.down('s') || this.down('arrowdown') || this.touch.brake) ? 1 : 0; }
  get steer() {
    let s = 0;
    if (this.down('a') || this.down('arrowleft')) s -= 1;
    if (this.down('d') || this.down('arrowright')) s += 1;
    if (s === 0) s = this.touch.steer;
    return s;
  }
  get boostKey() { return this.down(' ') || this.touch.boost; }
}

class Car {
  constructor(team, driver, isPlayer, track, gridIndex, totalLaps) {

    this.collisionCooldown = 0; // debounce so a single collision event only registers once, not every frame while cars are still touching
    this.pitBodyworkRepairSeconds = 0; // for HUD display: repair time computed at the moment this pit stop began
  }

  get totalProgress() {
    return this.lap * this.track.total + this.s;
  }

   /* Bodywork damage tiers:
     61-100: normal
     31-60: weaker steering response
     16-30: skidding
     6-15: both penalties
     5: destroyed
   
   /* Bodywork damage tiers */
  bodyworkSlowResponse() {
    return (
      (this.bodyworkWear <= 60 && this.bodyworkWear > 30) ||
      (this.bodyworkWear <= 15 && this.bodyworkWear > 5)
    );
  }

  bodyworkSkidding() {
    return this.bodyworkWear <= 30 && this.bodyworkWear > 5;
  }
  bodyworkRepairSeconds() {
    if (this.bodyworkWear >= 80) return 2;
    if (this.bodyworkWear >= 40) return 5;

  }

    if (this.state === 'pit') {
  this.speed = 0;

}

    // once it reaches 0 — this is the "impact disappears" half of collision handling. The actual

    // resolveCarCollisions (debounced there so it can't re-trigger every frame while cars touch).
    if (this.collisionImpactTimer > 0) this.collisionImpactTimer -= dt;

    const wear = this.tireWear();
    const wearSpeedMult = 1 - wear * 0.16;
    const wearHandlingMult = 1 - wear * 0.24;
    const wearBrakeMult = 1 - wear * 0.14;
    // Bodywork damage handling penalties (persistent until repaired at a pit stop — separate from
    // the temporary collision-impact effect above).
    const bodyworkHandlingMult = this.bodyworkSlowResponse() ? 0.68 : 1;
    const skidding = this.bodyworkSkidding();
    // Brief extra handling penalty only while the temporary impact is still active; fades to 1
    // automatically as collisionImpactTimer counts down to 0 — never stored permanently.
    const impactHandlingMult = this.collisionImpactTimer > 0 ? 0.55 : 1;
let maxSpeed = st.topSpeed * wearSpeedMult;
let accel = st.accel * 0.85 * wearSpeedMult;

// Detect a car physically inside the pit lane.
const inPitLane = inZoneS(this.track.pitZone, this.s, this.track.total) &&
  this.lateral > this.track.width / 2 + 6 &&
  this.lateral < this.track.pitLaneOffset + 60;
    // boost
    if (this.boostTimer > 0) { maxSpeed *= 1.35; this.boostTimer -= dt; }
   if (!inPitLane && this.state !== 'pit' &&
    boostHeld && this.boostCharges > 0 &&
    this.boostCooldown <= 0 && this.boostTimer <= 0) {

let frameSpeedCap = maxSpeed;

if (inPitLane || this.state === 'pit') {
  frameSpeedCap = Math.min(
    maxSpeed,
    this.speed > 95
      ? Math.max(95, this.speed - st.braking * wearBrakeMult * dt)

  );
}

    if (throttle > 0) this.speed += accel * throttle * dt;

    this.speed -= this.speed * 0.35 * dt;
    if (throttle <= 0 && brake <= 0) this.speed -= 40 * dt * Math.sign(this.speed || 1) * (this.speed > 0 ? 1 : 0);
  this.speed = clamp(this.speed, 0, frameSpeedCap);

    // steering: turn rate scaled by handling, reduced at high speed for realism
const speedFactor = clamp(1 - (this.speed / st.topSpeed) * 0.55, 0.45, 1);
const turnRate = 2.6 * st.handling * wearHandlingMult * bodyworkHandlingMult * impactHandlingMult * speedFactor;
this.angle += steer * turnRate * dt;

// Corner speed limit: reduce speed gradually instead of hard-capping it.
const cornerLookahead = 90 + this.speed * 0.55;
const cornerFar = cornerLookahead + 140;
const cornerP1 = this.track.pointAt(this.s + cornerLookahead);
const cornerP2 = this.track.pointAt(this.s + cornerFar);
const curveAmt = Math.abs(angDiff(cornerP1.angle, cornerP2.angle));

const cornerFactor = clamp(1 - curveAmt * 0.8, 0.55, 1);
const cornerSpeedLimit = st.topSpeed * cornerFactor;

const overSpeed = this.speed - cornerSpeedLimit;

if (overSpeed > 0) {
  const cornerSlowdown = clamp(overSpeed * 1.8, 0, 50);
  this.speed -= cornerSlowdown * dt;
}

// Bodywork skidding
if (skidding && Math.abs(steer) > 0.3 && this.speed > st.topSpeed * 0.35) {
 this.angle += (Math.random() - 0.5) * 0.07 *
  Math.abs(steer) * Math.sqrt(dt * 60);

    this.driftAngle,

  );

  this.y += vy * dt;

  }

    const total = track.total;
    const fwd = ((this.s - this.prevS) + total) % total;
    if (fwd > total * 0.5) return; // ignore weird jumps (e.g., post-bomb teleport)
    const nextCpS = track.checkpoints[this.checkpointIndex % track.checkpointCount];
    const rel = ((nextCpS - this.prevS) + total) % total;
    if (rel <= fwd + 0.01) {
      if (this.checkpointIndex % track.checkpointCount === 0) {
       // Estimate the crossing time within this frame so cars crossing in the
// same frame are ordered by when they actually reached the line.
const frameFraction = fwd > 0 ? clamp(rel / fwd, 0, 1) : 1;
const now = Number.isFinite(this._frameStartTime)
  ? this._frameStartTime +
    (Number.isFinite(this._frameDt) ? this._frameDt : 0) * frameFraction
  : this._nowRef;
const lapTime = now - this.lapStartTime;
        if (this.bestLapTime == null || lapTime < this.bestLapTime) this.bestLapTime = lapTime;
        this.lapStartTime = now;
        this.lap += 1;
        if (onLap) onLap(this);
        if (this.lap >= this.totalLaps && !this.finished) {
          this.finished = true;
          this.finishTime = now;
          if (onFinish) onFinish(this);

      }

}

/* ---------------------------- HAZARDS & AI ----------------------------------- */
function handleBoostPads(car, track, audio) {
  if (car.state !== 'racing') return;
  for (const pad of track.boostPads) {
    if (pad.cooldown > 0) continue;
    const w = track.worldAt(pad.s, pad.lateral);
    if (dist(car, w) < pad.radius + CAR_RADIUS) {
      car.boostTimer = Math.max(car.boostTimer, 0.9 * car.stats.boostEff);
      pad.cooldown = 3.5;
      car._padFlash = 0.4;
      if (car.isPlayer && audio) audio.boost();
    }
  }
}

function handleBombs(car, track, audio, allCarPositions) {
  if (car.state !== 'racing') return false;
  for (const b of track.activeBombs) {
    if (!b.alive) continue;
    const w = track.worldAt(b.s, b.lateral);
    if (dist(car, w) < b.radius + CAR_RADIUS) {
      b.alive = false;
      b.respawnT = rand(2.5, 4.5);
      b.flashT = 0.5;
      car.state = 'bombed';
      car.stateTimer = 2.0;
      // send back to nearest checkpoint location behind current position
      const cpIdx = (car.checkpointIndex - 1 + track.checkpointCount) % track.checkpointCount;
      const cpS = track.checkpoints[cpIdx];
      const p = track.worldAt(cpS, 0);
      car.x = p.x; car.y = p.y; car.angle = track.pointAt(cpS).angle;
      car.speed = 0;
      car.sGuess = cpS;
      if (car.isPlayer && audio) audio.bomb();
      return true;
    }
  }
  return false;
}

/* Physical pit-area system: a car "enters the pit area" simply by physically driving off the
   main racing surface into the pit lane corridor while positioned within the track's pit zone.
   This applies identically to the player and every AI bot — no special-casing either way. */
const PIT_STOP_SECONDS = 5.0;
const TIRE_EMERGENCY_SECONDS = 2.0;
const TIRE_FAILURE_SECONDS = 10.0;

function handlePitStop(car, track, audio) {
  // Once back on the normal track surface, the car becomes eligible to trigger another pit
  // stop again later — this prevents an instant re-trigger loop while still sitting in the lane.
  if (car.lateral <= track.width / 2 + 2) car.canPit = true;

  if (car.state !== 'racing' || !car.canPit) return;
  const inZone = inZoneS(track.pitZone, car.s, track.total);
  const inCorridor = car.lateral > track.width / 2 + 6 && car.lateral < track.pitLaneOffset + 60;
  if (inZone && inCorridor) {
    // The pit stop handles tire replacement and bodywork repair together. The standard tire
    // stop is always exactly PIT_STOP_SECONDS; bodywork repair time is ADDED on top of that
    // whenever the car isn't at 100% — so damage always visibly extends the stop, at every
    // severity tier (previously this only ran "concurrently", i.e. whichever was longer won,
    // which meant the two lighter damage tiers were silently absorbed by the 5s baseline and
    // never actually showed up as extra time).
    const bodyworkNeedsRepair = car.bodyworkWear < 100;
    const repairSeconds = car.bodyworkRepairSeconds();
    car.pitBodyworkRepairSeconds = bodyworkNeedsRepair ? repairSeconds : 0;
    car.state = 'pit';
    car.speed = 0;
car.boostTimer = 0;
    car.pitTotalSeconds = PIT_STOP_SECONDS + car.pitBodyworkRepairSeconds;
    car.stateTimer = car.pitTotalSeconds;
    car.tireStartLap = car.lapFraction();
    car.bodyworkWear = 100;
    car.emergencyTimer = 0;
    car.aiWantsPit = false;
    car.canPit = false;
    car.pitActive = true;
    if (car.isPlayer && audio) audio.pit();
  }
}

/* Universal red-tire emergency: the instant tire wear reaches 1.0 (critical/red), every driver
   — player or bot, near the pit or not — gets exactly 2 seconds to physically enter the pit
   area. If they make it in time, handlePitStop above naturally takes over (state becomes
   'pit', which stops this timer). If not, the tires fail and the car is force-stopped for 10s. */
function updateTireCritical(car, dt, audio) {
  if (car.state !== 'racing') return;

  if (!car.isCritical()) {
    car.emergencyTimer = 0;
    car.tireFailureHandled = false;
    return;
  }

  // Do not repeat the same tire failure until the tires are replaced.
  if (car.tireFailureHandled) return;

  car.emergencyTimer += dt;

  if (car.emergencyTimer >= TIRE_EMERGENCY_SECONDS) {
    car.state = 'tirefail';
    car.stateTimer = TIRE_FAILURE_SECONDS;
    car.emergencyTimer = 0;
    car.tireFailureHandled = true;

    if (car.isPlayer && audio) audio.bomb();
  }
}

function resolveCarCollisions(cars, audio) {
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
if (
  a.outOfRace || b.outOfRace ||
  a.state === 'bombed' || b.state === 'bombed' ||
  a.state === 'pit' || b.state === 'pit'
) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const minD = CAR_RADIUS * 2;
      if (d < minD) {
        // Positional separation runs every frame regardless (purely geometric — keeps cars from
        // sinking into each other), but the actual "hit" (speed cut, temporary impact effect,
        // bodywork wear) is debounced per car so it registers once per collision event, not once
        // per frame of continued contact. Without this, two cars resting against each other for
        // several frames would have their speed multiplied down repeatedly (0.82 compounding),
        // producing what looked like a permanent slowdown that never recovered — that was the bug.
        const overlap = (minD - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const aFresh = a.collisionCooldown <= 0;
        const bFresh = b.collisionCooldown <= 0;
        if (aFresh || bFresh) {
          if (aFresh) {
            a.speed *= 0.82;
            a.hitFlash = 0.15;
            a.collisionImpactTimer = 0.5; // TEMPORARY — decays on its own in physicsStep
            a.collisionCooldown = 0.5; // debounce window for THIS collision event
            a.bodyworkWear = clamp(a.bodyworkWear - 5, 5, 100); // PERSISTENT — stays until repaired at a pit stop
          }
          if (bFresh) {
            b.speed *= 0.82;
            b.hitFlash = 0.15;
            b.collisionImpactTimer = 0.5;
            b.collisionCooldown = 0.5;
            b.bodyworkWear = clamp(b.bodyworkWear - 5, 5, 100);
          }
          if ((a.isPlayer || b.isPlayer) && audio) audio.collision();
        }
      }
    }
  }
}

/* AI decision: returns {throttle, brake, steer, boost} */
function aiDecide(car, track, cars, dt, difficultySkill) {
  const profile = car.aiProfile || { skill: 0.7, reaction: 0.15 };
  const skill = clamp((difficultySkill != null ? difficultySkill : profile.skill) * car.stats.consistency, 0.2, 1.15);
  car.mistakeTimer -= dt;
  let mistake = false;
  if (car.mistakeTimer <= 0) {
    car.mistakeTimer = (rand(2.5, 6) + profile.reaction * 4) / skill;
    mistake = Math.random() > skill;
  }

  // Pit decision-making: once tire wear crosses this bot's (difficulty-tuned) threshold, the
  // tires actually go critical/red, or bodywork damage has become significant, the bot commits
  // to heading for the pits on its next approach.
  if (!car.aiWantsPit && car.state === 'racing') {
    const wear = car.tireWear();
    if (wear >= car.aiPitThreshold || car.isCritical() || car.bodyworkWear <= 25) car.aiWantsPit = true;
  }

  const lookaheadDist = 90 + car.speed * 0.55;
  const lookaheadFar = lookaheadDist + 140;
  const nearInfo = track.nearest(car.x, car.y, car.sGuess);
  const targetLateralBase = clamp(car.aiOvertakeBias * track.width * 0.18, -track.width * 0.32, track.width * 0.32);

  // obstacle avoidance: bombs
  let avoidLateral = 0;
  for (const b of track.activeBombs) {
    if (!b.alive) continue;
    const sAhead = ((b.s - nearInfo.s) + track.total) % track.total;
    if (sAhead < lookaheadFar) {
      const sameSide = Math.abs(b.lateral - targetLateralBase) < 55;
      if (sameSide) avoidLateral += (b.lateral > 0 ? -1 : 1) * 60;
    }
  }
  // obstacle avoidance / overtaking: other cars close ahead
  let brakeForTraffic = 0;
  for (const other of cars) {
    if (other === car) continue;
    const sAhead = ((other.s - nearInfo.s) + track.total) % track.total;
    if (sAhead < 70 && Math.abs(other.lateral - car.lateral) < 30) {
      avoidLateral += (car.lateral >= other.lateral ? 1 : -1) * 50;
      if (car.collisionImpactTimer <= 0) brakeForTraffic = 0.35;
    }
  }

  let targetLateral;
  // Physically steer into the pit lane once the bot has decided to pit and is approaching (or
  // already inside) the pit zone — otherwise drive the normal racing line as usual. The lateral
  // target ramps in gradually over a long approach window so the car has enough room/time to
  // actually complete the lane change at speed, rather than snapping to the full offset late and
  // missing the entry (which previously caused repeated tire-failure loops on some tracks).
  const PIT_APPROACH_DIST = 650;
const PIT_SLOWDOWN_DIST = 300;
  const sToZoneStart = ((track.pitZone.s0 - nearInfo.s) + track.total) % track.total;
  const insideZone = inZoneS(track.pitZone, nearInfo.s, track.total);
  const headingToPit = car.aiWantsPit && (sToZoneStart < PIT_APPROACH_DIST || insideZone);
  if (headingToPit) {
    if (insideZone) {
      targetLateral = track.pitLaneOffset;
    } else {
      const approachFrac = clamp(1 - sToZoneStart / PIT_APPROACH_DIST, 0, 1);
      targetLateral = lerp(targetLateralBase, track.pitLaneOffset, approachFrac);
    }
    brakeForTraffic = Math.max(brakeForTraffic, 0.25); // ease off approaching the pit lane
   } else {
    const mistakeOffset = mistake
      ? rand(-track.width * 0.25, track.width * 0.25)
      : 0;

const safeLateralLimit = Math.max(
  0,
  track.width / 2 - CAR_RADIUS - 2
);

targetLateral = clamp(
  targetLateralBase + avoidLateral + mistakeOffset,
  -safeLateralLimit,
  safeLateralLimit
);
  }

  const targetS = nearInfo.s + lookaheadDist;
  const targetPt = track.worldAt(targetS, targetLateral);
  const desiredAngle = Math.atan2(targetPt.y - car.y, targetPt.x - car.x);
  let steer = clamp(angDiff(car.angle, desiredAngle) * 2.2, -1, 1);

  // curvature ahead -> corner speed target
  const p1 = track.pointAt(nearInfo.s + lookaheadDist);
  const p2 = track.pointAt(nearInfo.s + lookaheadFar);
  const curveAmt = Math.abs(angDiff(p1.angle, p2.angle));
const cornerFactor = clamp(1 - curveAmt * 0.8, 0.55, 1);

let targetSpeed = car.stats.topSpeed * cornerFactor;

// Small mistake = small speed reduction, not a huge random drop.
if (mistake) {
  targetSpeed *= rand(0.92, 1);
}

// Traffic should make the AI ease off, but not destroy its corner-speed target.
if (brakeForTraffic > 0) {
  targetSpeed -= car.stats.topSpeed * Math.min(brakeForTraffic, 0.12);
}

targetSpeed = clamp(targetSpeed, car.stats.topSpeed * 0.55, car.stats.topSpeed);

if (headingToPit) {
  const pitSpeedLimit = insideZone
    ? 90
    : lerp(
        car.stats.topSpeed,
        90,
        clamp(
          (PIT_SLOWDOWN_DIST - sToZoneStart) /
            PIT_SLOWDOWN_DIST,
          0,
          1
        )
      );

  targetSpeed = Math.min(targetSpeed, pitSpeedLimit);
}
 let throttle = 0, brake = 0;

const speedError = car.speed - targetSpeed;

if (speedError < -5) {
  throttle = clamp((-speedError) / 12, 0, 1);
} else if (speedError > 5) {
  brake = clamp(speedError / 150, 0, 0.55);
}
  let boost = false;
  if (!headingToPit && curveAmt < 0.08 && car.boostCharges > 0 && car.boostTimer <= 0 && car.boostCooldown <= 0) {
    boost = Math.random() < (0.006 + car.stats.aggression * 0.004);
  }

  return { throttle, brake, steer, boost };
}
function compareRacePosition(a, b) {
  if (a.outOfRace && b.outOfRace) return 0;
if (a.outOfRace) return 1;
if (b.outOfRace) return -1;
  if (a.finished && b.finished) {
    const aTime = a.finishTime == null ? Infinity : a.finishTime;
    const bTime = b.finishTime == null ? Infinity : b.finishTime;
    return aTime - bTime;
  }

  if (a.finished) return -1;
  if (b.finished) return 1;

  return b.totalProgress - a.totalProgress;
}
/* ================================== GAME ===================================== */
class Game {
  constructor(canvas) {

    this.audio = new AudioManager();

    canvas.addEventListener('mousedown', (e) => { this._setMouse(e); this.input.mouse.down = true; this.audio.resume(); });
    canvas.addEventListener('mouseup', (e) => { this._setMouse(e); this.input.mouse.down = false; this.input.mouse.clicked = true; });
    canvas.addEventListener('touchstart', (e) => { this._setMouse(e.touches[0]); this.input.mouse.down = true; this.audio.resume(); }, { passive: true });
    canvas.addEventListener('touchend', (e) => { this.input.mouse.down = false; this.input.mouse.clicked = true; }, { passive: true });

     re-checks catch any environment where ResizeObserver isn't available or fires late. */
  _wireResize() {
    const recheck = () => this._resize();
    window.addEventListener('resize', recheck);
    window.addEventListener('orientationchange', recheck);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', recheck);
      window.visualViewport.addEventListener('scroll', recheck);
    }
    // Observe the canvas element itself — the single most direct signal for "did my
    // actual rendered box change", regardless of *why* (container resize, iframe resize,
    // flex recalculation, orientation change, host panel animating open, etc).
    if (typeof ResizeObserver !== 'undefined') {

      ro.observe(this.canvas);

    // slightly after load and fires no resize/observer event we catch in time.
    [0, 50, 150, 350, 700, 1200, 2000].forEach((ms) => setTimeout(recheck, ms));
  }

  _resize() {

    // whatever the browser already decided — never compute or assign a guessed pixel
    // size back into canvas.style, which is what previously let the canvas and the
    // control overlay (both sized from #stage) drift out of sync with each other.
    const rect = this.canvas.getBoundingClientRect();

this.zoom = isMobile
  ? clamp(h / 310, 1.05, 1.4)

  _setMouse(e) {

 if (finished) {
 const ranked = [...this.cars].sort(compareRacePosition);

  if (this.player.bestLapTime != null &&

  }

    }

} else {
      s.losses += 1;

      const inPitApproachNow = inZoneS(track.pitApproachZone, car.s, track.total);

      // player-only off-track defeat
      if (car.isPlayer && car.state === 'racing') {
        const margin = track.width / 2 + 14;
        if (!inPitApproachNow && Math.abs(car.lateral) > margin) {
          car.offTrackTimer += dt;
          if (car.offTrackTimer > 0.22) { this._onOffTrack(); return; }
        } else car.offTrackTimer = 0;
      }
               // AI recovery: allow brief excursions before retiring a bot.
      if (
  !car.isPlayer &&
  car.state === 'racing' &&
  !(car.aiWantsPit && inPitApproachNow)
) {
        const recoveryTrigger = track.width / 2 + 14;
        const safeLateral = Math.max(
          0,
          track.width / 2 - CAR_RADIUS - 2
        );

        if (Math.abs(car.lateral) > recoveryTrigger) {
          car.offTrackTimer += dt;

          // Retire only if recovery has failed for 0.75 seconds.
          if (car.offTrackTimer >= 0.75) {
            car.outOfRace = true;
            car.state = 'out';
            car.speed = 0;
            continue;
          }

          // Keep pushing the bot back toward the racing surface.
          const recoveryLateral =
            Math.sign(car.lateral) * safeLateral;

          const w = track.worldAt(car.s, recoveryLateral);

          car.x = lerp(car.x, w.x, 0.12);
          car.y = lerp(car.y, w.y, 0.12);
        } else {
          car.offTrackTimer = 0;
        }
      } else if (!car.isPlayer) {
        // Pit approach is intentional, so don't count it as an excursion.
        car.offTrackTimer = 0;
      }
   }
    if (playerFinishedThisFrame) {
  this._onPlayerFinish();
  return;
}
    resolveCarCollisions(this.cars, this.audio);
for (const car of this.cars) {
  if (car.finished || car.outOfRace || car.bodyworkWear > 5) {
    continue;
  }

  if (car.isPlayer) {
    this._onBodyworkDefeat();
    return;
  }

  car.outOfRace = true;
  car.state = 'out';
  car.speed = 0;
  car.aiWantsPit = false;
}
    // camera follow
    this.camera.x = lerp(this.camera.x, this.player.x, Math.min(1, dt * 5));
    this.camera.y = lerp(this.camera.y, this.player.y, Math.min(1, dt * 5));

    // positions
   const ranked = [...this.cars].sort(compareRacePosition);
    ranked.forEach((c, i) => { c.position = i + 1; });
    if (this.player.position !== this.lastPositions.player && this.lastPositions.player != null) {
      this.positionPopup = { text: `NOW P${this.player.position}`, t: 1.6 };
    }
    this.lastPositions.player = this.player.position;

    this.audio.updateEngine(this.player.speed / this.player.stats.topSpeed);

    if (this.pitMessage.t > 0) this.pitMessage.t -= dt;
    if (this.lapPopup.t > 0) this.lapPopup.t -= dt;
    if (this.positionPopup.t > 0) this.positionPopup.t -= dt;
    for (const c of this.cars) if (c.hitFlash > 0) c.hitFlash -= dt;

    // check if all AI + player finished or player finished -> handled in _onPlayerFinish
    for (const c of this.cars) {
  if (!c.isPlayer && !c.outOfRace && !c.finished && c.lap >= c.totalLaps) {
    c.finished = true;
    c.finishTime = this.raceClock;
   }
 }
} 
  _onPlayerFinish() {
    this.audio.stopEngine();
    this.recordResult(true);
    if (this.player.finishPos === 1) this.audio.driverVictory(this.player.driver.id);
    this.goto('VICTORY_OR_DEFEAT');
  }

  _onOffTrack() {
    this.audio.stopEngine();
    this.recordResult(false);
    this.offTrackDefeat = true;
    this.goto('DEFEAT_OFFTRACK');
  }
  _onBodyworkDefeat() {
    this.audio.stopEngine();
    this.recordResult(false);
    this.goto('DEFEAT_BODYWORK');
  }
  /* ------------------------------- LOOP -------------------------------- */
  _loop(tMs) {
    if (!this._lastT) this._lastT = tMs;
    let dt = (tMs - this._lastT) / 1000;
    this._lastT = tMs;
    dt = Math.min(dt, 1 / 20);
    this.buttons = [];
    this.update(dt);
    this.render();
    this.hitTest();
    this.input.endFrame();
    requestAnimationFrame((t) => this._loop(t));
  }

  render() {
    const ctx = this.ctx;
    if (typeof document !== 'undefined') document.body.dataset.state = this.state;
    ctx.clearRect(0, 0, this.W, this.H);
    switch (this.state) {
      case 'MENU': this._renderMenu(); break;
      case 'CAR_SELECT': this._renderCarSelect(); break;
      case 'DRIVER_SELECT': this._renderDriverSelect(); break;
      case 'TRACK_SELECT': this._renderTrackSelect(); break;
      case 'STATS': this._renderStats(); break;
      case 'SETTINGS': this._renderSettings(); break;
      case 'COUNTDOWN': this._renderWorld(); this._renderHUD(); this._renderCountdown(); break;
      case 'RACING': this._renderWorld(); this._renderHUD(); break;
      case 'PAUSED': this._renderWorld(); this._renderHUD(); this._renderPause(); break;
      case 'VICTORY_OR_DEFEAT': this._renderWorld(); this._renderResult(); break;
      case 'DEFEAT_OFFTRACK': this._renderWorld(); this._renderOfftrackDefeat(); break;
      case 'DEFEAT_BODYWORK': this._renderWorld(); this._renderBodyworkDefeat(); break;
    }
  }

  /* --------------------------- WORLD RENDER ---------------------------- */
  _renderWorld() {
    const ctx = this.ctx, track = this.track, W = this.W, H = this.H;
    const zoom = this.zoom || 1;
    ctx.save();
    ctx.fillStyle = track.def.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.scale(zoom, zoom);
    ctx.translate(W / (2 * zoom) - this.camera.x, H / (2 * zoom) - this.camera.y);

    // sand/off-track base band
    ctx.strokeStyle = track.def.sand;
    ctx.lineWidth = track.width + 130;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    this._strokeTrackPath(ctx);

    // tarmac
    ctx.strokeStyle = '#33363d';
    ctx.lineWidth = track.width;
    this._strokeTrackPath(ctx);

    // edge lines
    ctx.strokeStyle = '#e8e8e8';
    ctx.lineWidth = track.width + 6;
    ctx.globalCompositeOperation = 'destination-over';
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.strokeStyle = '#d8d8d8';
    ctx.lineWidth = 4;
    ctx.setLineDash([]);
    this._strokeOffset(ctx, track.width / 2);
    this._strokeOffset(ctx, -track.width / 2);
    ctx.restore();

    // curb stripes at start/finish
    this._drawStartFinish(ctx);
    // pit lane marker
    this._drawPitLane(ctx);

    // boost pads
    for (const pad of track.boostPads) {
      const w = track.worldAt(pad.s, pad.lateral);
      const pulse = 0.5 + 0.5 * Math.sin(this.time * 6);
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.rotate(track.pointAt(pad.s).angle);
      ctx.fillStyle = pad.cooldown > 0 ? 'rgba(80,180,255,0.25)' : `rgba(80,200,255,${0.55 + pulse * 0.3})`;
      ctx.fillRect(-24, -14, 48, 28);
      ctx.strokeStyle = '#bdf1ff'; ctx.lineWidth = 2;
      ctx.strokeRect(-24, -14, 48, 28);
      ctx.restore();
    }

    // bombs
    for (const b of track.activeBombs) {
      if (!b.alive) continue;
      const w = track.worldAt(b.s, b.lateral);
      const flash = b.flashT > 0 && Math.floor(this.time * 20) % 2 === 0;
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU);
      ctx.fillStyle = flash ? '#fff' : '#1c1c1c';
      ctx.fill();
      ctx.strokeStyle = flash ? '#ff3b30' : '#ff8a00'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = flash ? '#ff3b30' : '#ffcf4d';
      ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', 0, 0);
      ctx.restore();
    }

    // cars (draw non-players first, player last so it's on top)
    const drawOrder = [...this.cars].sort((a, b) => (a.isPlayer ? 1 : 0) - (b.isPlayer ? 1 : 0));
    for (const car of drawOrder) this._drawCar(ctx, car);

    ctx.restore();
  }

  _trackPathPoints() { return this.track.points; }

  _trackPathPoints() { return this.track.points; }

  _strokeTrackPath(ctx) {
    const track = this.track;
    const zoom = this.zoom || 1;

    const halfW = this.W / (2 * zoom);
    const halfH = this.H / (2 * zoom);

    const left = this.camera.x - halfW - 140;
    const right = this.camera.x + halfW + 140;
    const top = this.camera.y - halfH - 140;
    const bottom = this.camera.y + halfH + 140;

    for (const chunk of track.renderChunks) {
      if (
        chunk.maxX < left ||
        chunk.minX > right ||
        chunk.maxY < top ||
        chunk.minY > bottom
      ) {
        continue;
      }

      ctx.stroke(chunk.mainPath);
    }
  }

  _strokeOffset(ctx, off) {
  const track = this.track;
  const zoom = this.zoom || 1;

  const halfW = this.W / (2 * zoom);
  const halfH = this.H / (2 * zoom);

  const left = this.camera.x - halfW - 140;
  const right = this.camera.x + halfW + 140;
  const top = this.camera.y - halfH - 140;
  const bottom = this.camera.y + halfH + 140;

  const pathKey = off >= 0 ? 'leftPath' : 'rightPath';

  for (const chunk of track.renderChunks) {
    if (
      chunk.maxX < left ||
      chunk.minX > right ||
      chunk.maxY < top ||
      chunk.minY > bottom
    ) {
      continue;
    }

    ctx.stroke(chunk[pathKey]);
  }
}

  _drawStartFinish(ctx) {
    const track = this.track;
    const p = track.pointAt(0);
    const n = track.normalAt(0);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    const w = track.width;
    const seg = 10;
    for (let i = -w / 2; i < w / 2; i += seg) {
      ctx.fillStyle = (Math.floor((i + w / 2) / seg) % 2 === 0) ? '#fff' : '#111';
      ctx.fillRect(-6, i, 12, seg);
    }
    ctx.restore();
  }

  _drawPitLane(ctx) {
    const track = this.track;
    const z = track.pitZone;
    const laneOffset = track.pitLaneOffset;
    ctx.save();

    // paved pit lane surface
    ctx.strokeStyle = '#2b2d33';
    ctx.lineWidth = 46;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    let first = true;
    for (let s = z.s0; s <= z.s1; s += track.step) {
      const w = track.worldAt(s, laneOffset);
      if (first) { ctx.moveTo(w.x, w.y); first = false; } else ctx.lineTo(w.x, w.y);
    }
    ctx.stroke();

    // pit lane speed-limit line markings
    ctx.strokeStyle = 'rgba(255,209,77,0.65)';
    ctx.lineWidth = 4;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    first = true;
    for (let s = z.s0; s <= z.s1; s += track.step) {
      const w = track.worldAt(s, laneOffset);
      if (first) { ctx.moveTo(w.x, w.y); first = false; } else ctx.lineTo(w.x, w.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // entry/exit taper lines connecting main track to pit lane
    const entryMain = track.worldAt(z.s0, track.width / 2 + 4);
    const entryLane = track.worldAt(z.s0, laneOffset - 20);
    const exitLane = track.worldAt(z.s1, laneOffset - 20);
    const exitMain = track.worldAt(z.s1, track.width / 2 + 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(entryMain.x, entryMain.y); ctx.lineTo(entryLane.x, entryLane.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(exitMain.x, exitMain.y); ctx.lineTo(exitLane.x, exitLane.y); ctx.stroke();

    // bright checkered strip + big "PIT ENTRY" arrow right at the zone start, so it's
    // unmistakable from a distance which way to steer to begin a pit stop
    const entrySq = 12;
    for (let i = -2; i <= 2; i++) {
      const w = track.worldAt(z.s0, track.width / 2 + 8 + i * entrySq);
      ctx.fillStyle = (i % 2 === 0) ? '#fff' : '#1a1a1a';
      ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(track.pointAt(z.s0).angle);
      ctx.fillRect(-entrySq / 2, -entrySq / 2, entrySq, entrySq);
      ctx.restore();
    }
    const arrowP = track.worldAt(z.s0 - track.total * 0.012, track.width / 2 + 30);
    const arrowAngle = track.pointAt(z.s0).angle;
    ctx.save();
    ctx.translate(arrowP.x, arrowP.y);
    ctx.rotate(arrowAngle);
    ctx.fillStyle = 'rgba(61,220,132,0.95)';
    ctx.beginPath();
    ctx.moveTo(-18, -22); ctx.lineTo(18, -10); ctx.lineTo(18, 2); ctx.lineTo(38, 12); ctx.lineTo(18, 22); ctx.lineTo(18, 10); ctx.lineTo(-18, -2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a3d20'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    const labelP = track.worldAt(z.s0 - track.total * 0.012, track.width / 2 + 64);
    ctx.save();
    ctx.translate(labelP.x, labelP.y);
    ctx.rotate(arrowAngle);
    ctx.fillStyle = 'rgba(61,220,132,0.95)';
    ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PIT ENTRY', 0, 0);
    ctx.restore();

    // garage boxes for the four teams, spaced along the pit lane
    const midS0 = z.s0 + (z.s1 - z.s0) * 0.18;
    const midS1 = z.s0 + (z.s1 - z.s0) * 0.82;
    TEAMS.forEach((team, i) => {
      const s = lerp(midS0, midS1, i / 3);
      const p = track.pointAt(s);
      const w = track.worldAt(s, laneOffset + 34);
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = '#15161c';
      ctx.fillRect(-20, -26, 40, 52);
      ctx.fillStyle = team.primary;
      ctx.fillRect(-20, -26, 40, 10);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      ctx.strokeRect(-20, -26, 40, 52);
      ctx.restore();
    });

    // "PIT" sign at the midpoint
    const signP = track.worldAt((z.s0 + z.s1) / 2, laneOffset + 62);
    const signAngle = track.pointAt((z.s0 + z.s1) / 2).angle;
    ctx.save();
    ctx.translate(signP.x, signP.y);
    ctx.rotate(signAngle);
    ctx.fillStyle = 'rgba(255,209,77,0.92)';
    ctx.fillRect(-30, -12, 60, 24);
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.strokeRect(-30, -12, 60, 24);
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PIT', 0, 1);
    ctx.restore();

    ctx.restore();
  }

  _drawCar(ctx, car) {
    const flashOn = car.hitFlash > 0 && Math.floor(this.time * 30) % 2 === 0;
    const bombedOn = car.state === 'bombed' && Math.floor(this.time * 12) % 2 === 0;
    const sprite = CAR_SPRITES[car.team.id];

    ctx.save();
    ctx.translate(car.x, car.y);
    // sprite art is nose-up (forward = local -y); rotate +90deg so it aligns with car.angle
    // (car.angle: 0 = facing world +x, matching the physics convention used for movement)
    ctx.rotate(car.angle + Math.PI / 2);

    if (sprite && sprite.loaded) {
      const len = 44; // rendered car length along its direction of travel
      const wid = len * sprite.ratio;
      // shadow
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(2, 3, wid * 0.5, len * 0.3, 0, 0, TAU); ctx.fill();
      ctx.restore();
      // boost flame (rendered at the rear, i.e. local +y, before the car art so it peeks out behind)
      if (car.boostTimer > 0) {
        ctx.fillStyle = 'rgba(255,160,40,0.85)';
        ctx.beginPath();
        ctx.moveTo(-wid * 0.22, len / 2 - 2);
        ctx.lineTo(0, len / 2 + 14 + Math.random() * 10);
        ctx.lineTo(wid * 0.22, len / 2 - 2);
        ctx.fill();
      }
      ctx.drawImage(sprite.img, -wid / 2, -len / 2, wid, len);
      if (bombedOn || flashOn) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = bombedOn ? 'rgba(255,60,60,0.55)' : 'rgba(255,255,255,0.6)';
        ctx.fillRect(-wid / 2, -len / 2, wid, len);
        ctx.restore();
      }
    } else {
      // fallback while the sprite image is still loading: simple colored capsule
      ctx.fillStyle = bombedOn ? '#ff6b6b' : (flashOn ? '#ffffff' : car.team.primary);
      ctx.strokeStyle = car.team.secondary; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 14, 22, 0, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.restore();

    if (car.isPlayer) {
      ctx.save();
      ctx.translate(car.x, car.y - 30);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(0, 8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* --------------------------- HUD / OVERLAYS --------------------------- */
  _panel(ctx, x, y, w, h, r) {
    r = r || 10;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  _renderHUD() {
    const ctx = this.ctx, p = this.player;
    ctx.save();
    ctx.font = '600 13px "Segoe UI", Arial';
    ctx.textBaseline = 'middle';

    // top-right: driver/team
    ctx.fillStyle = 'rgba(10,10,14,0.72)';
    this._panel(ctx, this.W - 224, 14, 210, 60, 12); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 15px "Segoe UI", Arial';
    ctx.textAlign = 'right';
    ctx.fillText(p.driver.name, this.W - 34, 34);
    ctx.fillStyle = p.team.accent;
    ctx.font = '600 12px "Segoe UI", Arial';
    ctx.fillText(p.team.name.toUpperCase(), this.W - 34, 54);
    ctx.textAlign = 'left';

    // Car information: speed, boost, tires, bodywork and race timer
    const spd = Math.round(p.speed * 1.15);

    ctx.fillStyle = 'rgba(10,10,14,0.72)';
    this._panel(ctx, 14, 14, 190, 150, 12);
    ctx.fill();

    // Speed
    ctx.fillStyle = '#fff';
    ctx.font = '700 26px "Segoe UI", Arial';
    ctx.fillText(`${spd}`, 28, 48);

    ctx.font = '600 11px "Segoe UI", Arial';
    ctx.fillStyle = '#9aa';
    ctx.fillText('KM/H', 28, 68);

    // Boost
    ctx.fillStyle = '#333';
    ctx.fillRect(100, 32, 90, 9);
    ctx.fillStyle = p.boostTimer > 0 ? '#ffb020' : '#3ddc84';
    ctx.fillRect(100, 32, 90 * (p.boostCharges / 3), 9);

    ctx.font = '600 10px "Segoe UI", Arial';
    ctx.fillStyle = '#9aa';
    ctx.fillText('BOOST', 100, 48);

    // Tires
    const wear = p.tireWear();

    ctx.fillStyle = '#333';
    ctx.fillRect(100, 66, 90, 9);
    ctx.fillStyle = wear >= 1
      ? '#ff3b30'
      : (wear > 0.6 ? '#ffcf4d' : '#3ddc84');
    ctx.fillRect(100, 66, 90 * clamp(wear, 0, 1), 9);

    ctx.font = '600 10px "Segoe UI", Arial';
    ctx.fillStyle = wear >= 1 ? '#ff6b60' : '#9aa';
    ctx.fillText(wear >= 1 ? 'TIRES — PIT!' : 'TIRES', 100, 88);

    // Bodywork
    const body = p.bodyworkWear;
    const bodyColor =
      body <= 15 ? '#ff3b30' :
      body <= 30 ? '#ff8a65' :
      body <= 60 ? '#ffcf4d' :
      '#3ddc84';

    ctx.fillStyle = '#333';
    ctx.fillRect(100, 96, 90, 9);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(100, 96, 90 * clamp(body / 100, 0, 1), 9);

    ctx.font = '600 10px "Segoe UI", Arial';
    ctx.fillStyle = body <= 60 ? bodyColor : '#9aa';

    const bodyLabel =
      body <= 5  ? `BODY ${Math.round(body)}% — DESTROYED` :
      body <= 15 ? `BODY ${Math.round(body)}% — BOTH` :
      body <= 30 ? `BODY ${Math.round(body)}% — SKID RISK` :
      body <= 60 ? `BODY ${Math.round(body)}% — RESPONSE↓` :
      `BODY ${Math.round(body)}%`;

    ctx.fillText(bodyLabel, 100, 118);

    // Race timer
    ctx.font = '600 13px "Segoe UI", Arial';
    ctx.fillStyle = '#c9c9d4';
    ctx.fillText(`TIME ${fmtTime(this.raceClock)}`, 28, 144);

    // opponents mini leaderboard (stacked below driver panel, top-right)
    const ranked = [...this.cars].sort((a, b) => (a.position || 9) - (b.position || 9));
    ctx.fillStyle = 'rgba(10,10,14,0.72)';
    this._panel(ctx, this.W - 168, 82, 154, 94, 12); ctx.fill();
    ranked.forEach((c, i) => {
      ctx.fillStyle = c.isPlayer ? '#ffcf4d' : '#e7e7ee';
      ctx.font = c.isPlayer ? '700 13px Arial' : '600 13px Arial';
      ctx.fillText(`P${i + 1}`, this.W - 158, 98 + i * 21);
      ctx.fillStyle = c.team.primary;
      ctx.fillRect(this.W - 130, 93 + i * 21, 10, 10);
      ctx.fillStyle = c.isPlayer ? '#ffcf4d' : '#c9c9d4';
      ctx.font = '600 12px Arial';
      ctx.fillText(c.isPlayer ? 'YOU' : c.team.name.slice(0, 10), this.W - 114, 98 + i * 21);
      // bot tire/pit status tag
      if (!c.isPlayer) {
        let tag = null, tagColor = null;
                if (c.outOfRace) {
          tag = 'OUT';
          tagColor = '#ff3b30';
        } else if (c.state === 'pit') {
          tag = 'PIT';
          tagColor = '#ffcf4d';
        } else if (c.state === 'tirefail') {
          tag = 'STOP';
          tagColor = '#ff3b30';
        } else if (c.isCritical()) {
          tag = '\u25CF';
          tagColor = '#ff3b30';
        }
        if (tag) { ctx.fillStyle = tagColor; ctx.font = '700 11px Arial'; ctx.textAlign = 'right'; ctx.fillText(tag, this.W - 20, 98 + i * 21); ctx.textAlign = 'left'; }
      }
    });

    // pit / lap / position popups
    if (this.pitMessage.t > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,60,40,0.88)';
      this._panel(ctx, this.W / 2 - 190, 16, 380, 34, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '700 15px Arial';
      ctx.fillText(this.pitMessage.text, this.W / 2, 34);
      ctx.textAlign = 'left';
    }
    if (this.lapPopup.t > 0) {
      ctx.textAlign = 'center'; ctx.globalAlpha = clamp(this.lapPopup.t, 0, 1);
      ctx.fillStyle = '#fff'; ctx.font = '700 28px Arial';
      ctx.fillText(this.lapPopup.text, this.W / 2, this.H / 2 - 60);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
    if (this.positionPopup.t > 0) {
      ctx.textAlign = 'center'; ctx.globalAlpha = clamp(this.positionPopup.t, 0, 1);
      ctx.fillStyle = '#ffcf4d'; ctx.font = '700 20px Arial';
      ctx.fillText(this.positionPopup.text, this.W / 2, this.H / 2 - 30);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
    if (p.state === 'bombed') {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, this.W, this.H);
      ctx.fillStyle = '#ff3b30'; ctx.font = '700 26px Arial';
      ctx.fillText('HIT BY BOMB', this.W / 2, this.H / 2 - 16);
      ctx.font = '700 40px Arial'; ctx.fillStyle = '#fff';
      ctx.fillText(Math.ceil(p.stateTimer).toString(), this.W / 2, this.H / 2 + 30);
      ctx.textAlign = 'left';
    } else if (p.state === 'pit') {
      const remain = Math.max(0, Math.ceil(p.stateTimer));
      const showBodywork = p.pitBodyworkRepairSeconds > 0;
      const panelH = showBodywork ? 100 : 76;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,209,77,0.16)'; ctx.fillRect(0, 0, this.W, this.H);
      ctx.fillStyle = 'rgba(20,22,30,0.85)';
      this._panel(ctx, this.W / 2 - 190, this.H / 2 - 132, 380, panelH, 10); ctx.fill();
      ctx.fillStyle = '#ffcf4d'; ctx.font = '700 21px Arial';
      ctx.fillText(`PIT STOP \u2014 ${Math.ceil(p.pitTotalSeconds || PIT_STOP_SECONDS)} SECONDS`, this.W / 2, this.H / 2 - 98);
      if (showBodywork) {
        ctx.fillStyle = '#ff8a65'; ctx.font = '700 15px Arial';
        ctx.fillText(`TIRES ${Math.ceil(PIT_STOP_SECONDS)}s + BODYWORK REPAIR \u2014 +${p.pitBodyworkRepairSeconds} SECONDS`, this.W / 2, this.H / 2 - 78);
      }
      ctx.font = '700 28px Arial'; ctx.fillStyle = '#fff';
      ctx.fillText(String(remain), this.W / 2, this.H / 2 - 132 + panelH - 16);
      ctx.textAlign = 'left';
    } else if (p.state === 'tirefail') {
      const remain = Math.max(0, Math.ceil(p.stateTimer));
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,40,30,0.18)'; ctx.fillRect(0, 0, this.W, this.H);
      ctx.fillStyle = 'rgba(40,10,10,0.88)';
      this._panel(ctx, this.W / 2 - 220, this.H / 2 - 132, 440, 76, 10); ctx.fill();
      ctx.fillStyle = '#ff3b30'; ctx.font = '700 19px Arial';
      ctx.fillText('TIRE FAILURE \u2014 STOPPED FOR 10 SECONDS', this.W / 2, this.H / 2 - 98);
      ctx.font = '700 28px Arial'; ctx.fillStyle = '#fff';
      ctx.fillText(String(remain), this.W / 2, this.H / 2 - 66);
      ctx.textAlign = 'left';
    } else if (p.state === 'racing' && p.isCritical()) {
      const remain = Math.max(0, TIRE_EMERGENCY_SECONDS - p.emergencyTimer);
      const count = Math.ceil(remain);
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,30,20,0.9)';
      this._panel(ctx, this.W / 2 - 220, 16, 440, 50, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '700 15px Arial';
      ctx.fillText('\u26A0 TIRES CRITICAL \u2014 2 SECONDS TO PIT!', this.W / 2, 34);
      ctx.font = '700 16px Arial';
      ctx.fillText(count > 0 ? `${count}...` : '0...', this.W / 2, 55);
      ctx.textAlign = 'left';
    }

    // pause button hint (keyboard only — touch devices use the on-screen pause button)
    if (typeof document === 'undefined' || !document.body.classList.contains('is-touch')) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 11px Arial';
      ctx.fillText('P = PAUSE', this.W - 90, this.H - 14);
    }
    ctx.restore();
  }

  _renderCountdown() {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, this.W, this.H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.font = '900 96px Arial';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;

    ctx.fillStyle = n > 0 ? '#fff' : '#3ddc84';
    ctx.fillText(label, this.W / 2, this.H / 2);
    ctx.restore();
  }
