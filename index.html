  /* -------------------------------- MENUS -------------------------------- */
  _bgGradient() {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, this.H);
    g.addColorStop(0, '#0d0f1a');
    g.addColorStop(1, '#171a2b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.W, this.H);
    // speed streaks
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i < 14; i++) {
      const y = (i * 53 + this.time * 40) % (this.H + 40) - 20;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.W, y - 30); ctx.stroke();
    }
  }

  _title(text, sub) {
    const ctx = this.ctx;
    ctx.textAlign = 'left';
    ctx.font = '900 34px "Segoe UI", Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 40, 62);
    if (sub) {
      ctx.font = '600 14px "Segoe UI", Arial';
      ctx.fillStyle = '#8f93ab';
      ctx.fillText(sub, 40, 84);
    }
    ctx.strokeStyle = '#e10600'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(40, 96); ctx.lineTo(120, 96); ctx.stroke();
  }

  _menuBtn(x, y, w, h, label, onClick, active) {
    const ctx = this.ctx;
    const hover = this._isHover(x, y, w, h);
    ctx.fillStyle = active ? '#e10600' : (hover ? '#262b42' : 'rgba(255,255,255,0.05)');
    this._panel(ctx, x, y, w, h, 8); ctx.fill();
    ctx.strokeStyle = active ? '#ff8080' : 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5;
    this._panel(ctx, x, y, w, h, 8); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 15px "Segoe UI", Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    this.button(x, y, w, h, label, onClick);
  }

  _isHover(x, y, w, h) {
    const m = this.input.mouse;
    return m.x >= x && m.x <= x + w && m.y >= y && m.y <= y + h;
  }

  /* Computes a responsive N-card grid that always fits inside the current canvas,
     wrapping to more rows/fewer columns and shrinking card size on narrow/short screens. */
  _gridLayout(n, opts) {
    const o = Object.assign({ minW: 160, maxW: 260, maxCols: 4, gap: 16, margin: 24, startY: 112, bottomMargin: 70, minH: 180, maxH: 320 }, opts);
    const availW = this.W - o.margin * 2;
    let cols = Math.max(1, Math.min(o.maxCols, n, Math.floor((availW + o.gap) / (o.minW + o.gap))));
    let cardW = Math.min(o.maxW, Math.floor((availW - o.gap * (cols - 1)) / cols));
    const rows = Math.ceil(n / cols);
    const totalRowW = cardW * cols + o.gap * (cols - 1);
    const xOff = o.margin + Math.max(0, (availW - totalRowW) / 2);
    const availH = this.H - o.startY - o.bottomMargin;
    let cardH = Math.min(o.maxH, Math.floor((availH - o.gap * (rows - 1)) / rows));
    cardH = Math.max(o.minH, cardH);
    const rects = [];
    for (let i = 0; i < n; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      rects.push({ x: xOff + col * (cardW + o.gap), y: o.startY + row * (cardH + o.gap), w: cardW, h: cardH, scale: clamp(Math.min(cardW / o.maxW, cardH / o.maxH), 0.55, 1) });
    }
    rects.rows = rows; rects.cols = cols;
    return rects;
  }

  _renderMenu() {
    this._bgGradient();
    this._title('FORMULA RACER', 'Arcade Grand Prix \u2014 Select an option to begin');
    const items = [
      ['Start Race', () => this.goto('CAR_SELECT')],
      ['Car Selection', () => this.goto('CAR_SELECT')],
      ['Driver Selection', () => this.goto('DRIVER_SELECT')],
      ['Track Selection', () => this.goto('TRACK_SELECT')],
      ['Statistics', () => this.goto('STATS')],
      ['Settings', () => this.goto('SETTINGS')],
    ];
    const narrow = this.W < 760;
    const startX = 24, startY = 112, h = 48, gap = 12;
    const w = narrow ? this.W - startX * 2 : 320;
    items.forEach(([label, fn], i) => this._menuBtn(startX, startY + i * (h + gap), w, h, label, fn));

    // preview panel: beside the list on wide screens, stacked below it on narrow/mobile screens
    const team = TEAMS[this.selection.teamIdx], driver = DRIVERS[this.selection.driverIdx], trk = TRACK_DEFS[this.selection.trackIdx];
    const listBottom = startY + items.length * (h + gap) - gap;
    const px = narrow ? startX : 420;
    const py = narrow ? listBottom + 20 : startY;
    const pw = narrow ? (this.W - startX * 2) : (this.W - px - 40);
    const ph = 200;
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    this._panel(ctx, px, py, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; this._panel(ctx, px, py, pw, ph, 12); ctx.stroke();
    ctx.fillStyle = '#8f93ab'; ctx.font = '600 12px Arial';
    ctx.fillText('CURRENT SETUP', px + 24, py + 26);
    ctx.fillStyle = team.primary; ctx.fillRect(px + 24, py + 40, 20, 20);
    ctx.fillStyle = '#fff'; ctx.font = '700 17px Arial';
    ctx.fillText(team.name, px + 54, py + 55);
    ctx.font = '600 13px Arial'; ctx.fillStyle = '#c9c9d4';
    ctx.fillText(`Driver: ${driver.name}`, px + 24, py + 86);
    ctx.fillText(`Track: ${trk.name} \u2014 ${trk.difficulty}`, px + 24, py + 108);
    ctx.fillText(`Race Length: ${this.selection.laps || 10} lap${(this.selection.laps || 10) > 1 ? 's' : ''}`, px + 24, py + 130);
    ctx.font = '600 11px Arial'; ctx.fillStyle = '#8f93ab';
    ctx.fillText(`Best Position: ${this.stats.bestPosition || '\u2014'}   Wins: ${this.stats.wins}   Races: ${this.stats.totalRaces}`, px + 24, py + 152);

    this._menuBtnBig(px + 20, py + ph - 46, pw - 40, 38, 'LAUNCH RACE', () => this.startRace());
  }

  _menuBtnBig(x, y, w, h, label, onClick) {
    const ctx = this.ctx;
    const hover = this._isHover(x, y, w, h);
    ctx.fillStyle = hover ? '#ff2d20' : '#e10600';
    this._panel(ctx, x, y, w, h, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    this.button(x, y, w, h, label, onClick);
  }

  _backBtn() { this._menuBtn(24, this.H - 58, Math.min(140, this.W * 0.32), 42, '\u2190 Back', () => this.goto('MENU')); }

  _renderCarSelect() {
    this._bgGradient();
    this._title('CAR SELECTION', 'Choose your team \u2014 balanced stats, distinct personalities');
    const ctx = this.ctx;
    const rects = this._gridLayout(TEAMS.length, { minW: 165, maxW: 250, maxCols: 4, gap: 16, margin: 24, startY: 112, bottomMargin: 66, minH: 200, maxH: 300 });
    TEAMS.forEach((t, i) => {
      const r = rects[i], x = r.x, y = r.y, cardW = r.w, cardH = r.h, k = r.scale;
      const active = i === this.selection.teamIdx;
      ctx.fillStyle = active ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
      this._panel(ctx, x, y, cardW, cardH, 14); ctx.fill();
      ctx.strokeStyle = active ? t.accent : 'rgba(255,255,255,0.1)'; ctx.lineWidth = active ? 3 : 1.5;
      this._panel(ctx, x, y, cardW, cardH, 14); ctx.stroke();
      // livery preview: real car photo (rotated to face right), color strip as fallback while loading
      const swatchH = 54 * k;
      const swatchY = y + 14 * k;
      ctx.save();
      ctx.beginPath(); ctx.rect(x + 16 * k, swatchY, cardW - 32 * k, swatchH); ctx.clip();
      const sprite = CAR_SPRITES[t.id];
      if (sprite && sprite.loaded) {
        ctx.fillStyle = '#1a1c24'; ctx.fillRect(x + 16 * k, swatchY, cardW - 32 * k, swatchH);
        const imgLen = swatchH * 1.7; // car length shown a bit larger than the strip, cropped by clip()
        const imgWid = imgLen * sprite.ratio;
        ctx.save();
        ctx.translate(x + cardW / 2, swatchY + swatchH / 2);
        ctx.rotate(Math.PI / 2); // nose-up art -> facing right
        ctx.drawImage(sprite.img, -imgWid / 2, -imgLen / 2, imgWid, imgLen);
        ctx.restore();
      } else {
        ctx.fillStyle = t.primary; ctx.fillRect(x + 16 * k, swatchY, cardW - 32 * k, swatchH);
      }
      ctx.restore();
      ctx.fillStyle = t.accent; ctx.fillRect(x + 16 * k, y + 70 * k, cardW - 32 * k, 6 * k);
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(18 * k)}px Arial`; ctx.textAlign = 'left';
      ctx.fillText(t.name, x + 16 * k, y + 92 * k);
      const stats = [
        ['Top Speed', t.stats.topSpeed, 320], ['Acceleration', t.stats.accel, 170],
        ['Braking', t.stats.braking, 250], ['Handling', Math.round(t.stats.handling * 100), 100],
      ];
      stats.forEach((s, si) => {
        const by = y + 116 * k + si * 32 * k;
        ctx.font = `600 ${Math.round(11 * k)}px Arial`; ctx.fillStyle = '#c9c9d4'; ctx.fillText(s[0], x + 16 * k, by);
        ctx.fillStyle = '#242840'; ctx.fillRect(x + 16 * k, by + 5, cardW - 32 * k, 6);
        ctx.fillStyle = t.accent; ctx.fillRect(x + 16 * k, by + 5, (cardW - 32 * k) * clamp(s[1] / s[2], 0.15, 1), 6);
      });
      this.button(x, y, cardW, cardH, t.name, () => { this.selection.teamIdx = i; });
    });
    this._menuBtnBig(Math.max(24, this.W - 260), this.H - 58, Math.min(220, this.W - 48), 42, 'Continue \u2192', () => this.goto('DRIVER_SELECT'));
    this._backBtn();
  }

  _renderDriverSelect() {
    this._bgGradient();
    this._title('DRIVER SELECTION', 'Pick a driver \u2014 each brings a different edge on track');
    const ctx = this.ctx;
    const rects = this._gridLayout(DRIVERS.length, { minW: 170, maxW: 260, maxCols: 4, gap: 16, margin: 24, startY: 112, bottomMargin: 66, minH: 200, maxH: 280 });
    DRIVERS.forEach((d, i) => {
      const r = rects[i], x = r.x, y = r.y, cardW = r.w, cardH = r.h, k = r.scale;
      const active = i === this.selection.driverIdx;
      ctx.fillStyle = active ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
      this._panel(ctx, x, y, cardW, cardH, 14); ctx.fill();
      ctx.strokeStyle = active ? '#e10600' : 'rgba(255,255,255,0.1)'; ctx.lineWidth = active ? 3 : 1.5;
      this._panel(ctx, x, y, cardW, cardH, 14); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(17 * k)}px Arial`; ctx.textAlign = 'left';
      ctx.fillText(d.name, x + 16 * k, y + 30 * k);
      const stats = [['Cornering', d.stats.cornering], ['Reaction', d.stats.reaction], ['Overtaking', d.stats.overtaking], ['Aggression', d.stats.aggression], ['Consistency', d.stats.consistency]];
      stats.forEach((s, si) => {
        const by = y + 58 * k + si * 32 * k;
        ctx.font = `600 ${Math.round(11 * k)}px Arial`; ctx.fillStyle = '#c9c9d4'; ctx.fillText(s[0], x + 16 * k, by);
        ctx.fillStyle = '#242840'; ctx.fillRect(x + 16 * k, by + 5, cardW - 32 * k, 6);
        ctx.fillStyle = '#e10600'; ctx.fillRect(x + 16 * k, by + 5, (cardW - 32 * k) * clamp((s[1] - 0.9) / 0.2, 0.1, 1), 6);
      });
      this.button(x, y, cardW, cardH, d.name, () => { this.selection.driverIdx = i; });
    });
    this._menuBtnBig(Math.max(24, this.W - 260), this.H - 58, Math.min(220, this.W - 48), 42, 'Continue \u2192', () => this.goto('TRACK_SELECT'));
    this._backBtn();
  }

  _renderTrackSelect() {
    this._bgGradient();
    this._title('TRACK SELECTION', 'Three circuits, three levels of challenge');
    const ctx = this.ctx;
    const rects = this._gridLayout(TRACK_DEFS.length, { minW: 190, maxW: 330, maxCols: 3, gap: 16, margin: 24, startY: 108, bottomMargin: 132, minH: 230, maxH: 320 });
    TRACK_DEFS.forEach((t, i) => {
      const r = rects[i], x = r.x, y = r.y, cardW = r.w, cardH = r.h, k = r.scale;
      const active = i === this.selection.trackIdx;
      ctx.fillStyle = active ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
      this._panel(ctx, x, y, cardW, cardH, 14); ctx.fill();
      ctx.strokeStyle = active ? '#3ddc84' : 'rgba(255,255,255,0.1)'; ctx.lineWidth = active ? 3 : 1.5;
      this._panel(ctx, x, y, cardW, cardH, 14); ctx.stroke();
      // mini track preview
      const previewH = cardH * 0.42;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, cardW, previewH + 10); ctx.clip();
      ctx.translate(x + cardW / 2, y + previewH / 2 + 6);
      const tmpTrack = this._previewTrack(t);
      const b = tmpTrack.bounds;
      const scale = Math.min((cardW - 32 * k) / (b.maxX - b.minX), (previewH - 10) / (b.maxY - b.minY));
      ctx.scale(scale, scale);
      ctx.translate(-(b.minX + b.maxX) / 2, -(b.minY + b.maxY) / 2);
      ctx.strokeStyle = '#555'; ctx.lineWidth = t.width * 0.9;
      ctx.beginPath();
      tmpTrack.points.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle = '#3ddc84'; ctx.lineWidth = 4; ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(18 * k)}px Arial`; ctx.textAlign = 'left';
      ctx.fillText(t.name, x + 16 * k, y + previewH + 34);
      const diffColor = t.difficulty === 'Easy' ? '#3ddc84' : (t.difficulty === 'Medium' ? '#ffcf4d' : '#ff4d4d');
      ctx.fillStyle = diffColor; ctx.font = `700 ${Math.round(12 * k)}px Arial`;
      ctx.fillText(t.difficulty.toUpperCase(), x + 16 * k, y + previewH + 54);
      ctx.fillStyle = '#8f93ab'; ctx.font = `600 ${Math.round(11 * k)}px Arial`;
      this._wrapText(t.desc, x + 16 * k, y + previewH + 76, cardW - 32 * k, 15 * k);
      this.button(x, y, cardW, cardH, t.name, () => { this.selection.trackIdx = i; });
    });

    // race length selector
    const lapY = this.H - 118;
    ctx.fillStyle = '#8f93ab'; ctx.font = '600 12px Arial'; ctx.textAlign = 'left';
    ctx.fillText('RACE LENGTH', 24, lapY - 8);
    const lapOptions = [1, 5, 10, 30, 60];
    const lapBtnW = Math.min(84, (this.W - 48 - (lapOptions.length - 1) * 10) / lapOptions.length);
    lapOptions.forEach((n, i) => {
      const bx = 24 + i * (lapBtnW + 10);
      this._menuBtn(bx, lapY, lapBtnW, 40, `${n} lap${n > 1 ? 's' : ''}`, () => { this.selection.laps = n; }, this.selection.laps === n);
    });

    this._menuBtnBig(Math.max(24, this.W - 260), this.H - 58, Math.min(220, this.W - 48), 42, 'Launch Race \u2192', () => this.startRace());
    this._backBtn();
  }

  _previewTrack(def) {
    this._previewCache = this._previewCache || {};
    if (!this._previewCache[def.id]) this._previewCache[def.id] = new Track(def);
    return this._previewCache[def.id];
  }

  _wrapText(text, x, y, maxW, lh) {
    const ctx = this.ctx;
    const words = text.split(' ');
    let line = '', yy = y;
    for (const w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w + ' '; yy += lh; }
      else line = test;
    }
    ctx.fillText(line, x, yy);
  }

  _renderStats() {
    this._bgGradient();
    this._title('STATISTICS', 'Your career so far');
    const s = this.stats, ctx = this.ctx;
    const winPct = s.totalRaces ? Math.round((s.wins / s.totalRaces) * 100) : 0;
    let favCar = '\u2014', favTrack = '\u2014';
    let maxC = 0; for (const k in s.carCounts) if (s.carCounts[k] > maxC) { maxC = s.carCounts[k]; favCar = (TEAMS.find(t => t.id === k) || {}).name || k; }
    let maxT = 0; for (const k in s.trackCounts) if (s.trackCounts[k] > maxT) { maxT = s.trackCounts[k]; favTrack = (TRACK_DEFS.find(t => t.id === k) || {}).name || k; }
    const rows = [
      ['Total Races', s.totalRaces], ['Wins', s.wins], ['Losses', s.losses], ['Win %', winPct + '%'],
      ['Best Lap', s.bestLap != null ? fmtTime(s.bestLap) : '\u2014'],
      ['Best Race Time', s.bestRaceTime != null ? fmtTime(s.bestRaceTime) : '\u2014'],
      ['Best Position', s.bestPosition != null ? 'P' + s.bestPosition : '\u2014'],
      ['Favorite Car', favCar], ['Favorite Track', favTrack],
    ];
    const cardW = 460, colGap = 40;
    rows.forEach((r, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = 40 + col * (cardW + colGap), y = 130 + row * 56;
      ctx.fillStyle = 'rgba(255,255,255,0.04)'; this._panel(ctx, x, y, cardW, 44, 8); ctx.fill();
      ctx.fillStyle = '#8f93ab'; ctx.font = '600 13px Arial'; ctx.fillText(r[0], x + 18, y + 27);
      ctx.fillStyle = '#fff'; ctx.font = '700 16px Arial'; ctx.textAlign = 'right';
      ctx.fillText(String(r[1]), x + cardW - 18, y + 28); ctx.textAlign = 'left';
    });
    this._backBtn();
  }

  _renderSettings() {
    this._bgGradient();
    this._title('SETTINGS', 'Audio and control reference');
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; this._panel(ctx, 40, 120, 500, 60, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 15px Arial'; ctx.fillText('Sound', 60, 145);
    ctx.font = '600 12px Arial'; ctx.fillStyle = '#8f93ab'; ctx.fillText('Toggle engine and effect audio', 60, 163);
    this._menuBtn(420, 132, 100, 36, this.audio.enabled ? 'ON' : 'OFF', () => { this.audio.enabled = !this.audio.enabled; if (!this.audio.enabled) this.audio.stopEngine(); });

    ctx.fillStyle = 'rgba(255,255,255,0.04)'; this._panel(ctx, 40, 200, 500, 250, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 15px Arial'; ctx.fillText('Controls', 60, 228);
    const controls = [['W / \u2191', 'Accelerate'], ['S / \u2193', 'Brake'], ['A / \u2190', 'Steer left'], ['D / \u2192', 'Steer right'], ['Space', 'Activate boost'], ['P', 'Pause']];
    controls.forEach((c, i) => {
      const y = 254 + i * 30;
      ctx.fillStyle = '#ffcf4d'; ctx.font = '700 13px Arial'; ctx.fillText(c[0], 60, y);
      ctx.fillStyle = '#c9c9d4'; ctx.font = '600 13px Arial'; ctx.fillText(c[1], 200, y);
    });
    this._backBtn();
  }
}

/* -------------------------------- MAIN -------------------------------------- */
function bootFormulaRacer(canvasEl) {
  return new Game(canvasEl);
}
if (typeof window !== 'undefined') window.bootFormulaRacer = bootFormulaRacer;

function setupMobileControls(game) {
  const touch = game.input.touch;
 const isMobileControlDevice =
  window.matchMedia('(pointer: coarse)').matches &&
  Math.min(screen.width, screen.height) <= 900;

document.body.classList.toggle('is-touch', isMobileControlDevice);
  const supportsPointer = typeof window.PointerEvent !== 'undefined';

  // Each button tracks its OWN set of active pointer ids (finger/mouse), independent of every
  // other button. This is what makes holding Accelerate with one finger while tapping Boost with
  // a second finger work reliably — with the old touchstart/touchend + mousedown/mouseup dual
  // handling, a second finger's press could get lost to delayed synthetic mouse-event compat
  // behavior some mobile browsers fire after a touch. Pointer Events avoid that entirely.
  function bindHold(el, onStart, onEnd) {
    if (!el) return;
    el.style.touchAction = 'none';
    if (supportsPointer) {
      const active = new Set();
      const start = (e) => {
        e.preventDefault();
        active.add(e.pointerId);
        el.addEventListener('lostpointercapture', end);
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        el.classList.add('mc-active');
        onStart();
        game.audio.resume();
      };
      const end = (e) => {
        if (!active.has(e.pointerId)) return;
        active.delete(e.pointerId);
        try { el.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        if (active.size === 0) { el.classList.remove('mc-active'); onEnd(); }
      };
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    } else {
      // Legacy fallback for browsers without Pointer Events support.
      const start = (e) => { e.preventDefault(); el.classList.add('mc-active'); onStart(); game.audio.resume(); };
      const end = (e) => { if (e) e.preventDefault(); el.classList.remove('mc-active'); onEnd(); };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('touchcancel', end, { passive: false });
      el.addEventListener('mousedown', start);
      window.addEventListener('mouseup', end);
    }
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  bindHold(document.getElementById('btnAccel'), () => { touch.throttle = 1; }, () => { touch.throttle = 0; });
  bindHold(document.getElementById('btnBrake'), () => { touch.brake = 1; }, () => { touch.brake = 0; });
  bindHold(document.getElementById('btnBoost'), () => { touch.boost = true; }, () => { touch.boost = false; });
  bindHold(document.getElementById('btnLeft'),
    () => { touch.steer = -1; },
    () => { if (touch.steer === -1) touch.steer = 0; });
  bindHold(document.getElementById('btnRight'),
    () => { touch.steer = 1; },
    () => { if (touch.steer === 1) touch.steer = 0; });

  const pauseBtn = document.getElementById('btnPause');
  if (pauseBtn) {
    pauseBtn.style.touchAction = 'none';
    const tap = (e) => { e.preventDefault(); touch.pauseTap = true; game.audio.resume(); };
    if (supportsPointer) pauseBtn.addEventListener('pointerdown', tap);
    else {
      pauseBtn.addEventListener('touchstart', tap, { passive: false });
      pauseBtn.addEventListener('mousedown', tap);
    }
  }

  // Prevent the page itself from scrolling/bouncing while touching controls or canvas.
  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
}

window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('game');
  const game = bootFormulaRacer(canvas);
  setupMobileControls(game);
});
</script>
